name: Windows release package

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Build and attach Windows x64 ZIP
    runs-on: windows-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Set up the Windows GNU linker
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build desktop and command-line apps
        shell: pwsh
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER = Join-Path $env:MSYS2_LOCATION 'ucrt64\bin\gcc.exe'
          if (-not (Test-Path -LiteralPath $env:CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER)) { throw 'No se encontró el linker GNU de Windows.' }
          cargo build --locked --release --bins --target x86_64-pc-windows-gnu

      - name: Download yt-dlp and Deno
        shell: pwsh
        run: |
          $toolsDirectory = Join-Path $env:GITHUB_WORKSPACE '.tools'
          $denoDirectory = Join-Path $toolsDirectory 'deno'
          New-Item -ItemType Directory -Force -Path $denoDirectory | Out-Null
          Invoke-WebRequest 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile (Join-Path $toolsDirectory 'yt-dlp.exe')
          $denoArchive = Join-Path $env:RUNNER_TEMP 'deno-windows-x64.zip'
          Invoke-WebRequest 'https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip' -OutFile $denoArchive
          Expand-Archive -LiteralPath $denoArchive -DestinationPath $denoDirectory -Force
          & (Join-Path $toolsDirectory 'yt-dlp.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp no se pudo ejecutar.' }
          & (Join-Path $denoDirectory 'deno.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'Deno no se pudo ejecutar.' }

      - name: Package and validate required files
        shell: pwsh
        run: .\package-windows.ps1 -BinaryDirectory '.\target\x86_64-pc-windows-gnu\release'

      - name: Attach package to the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:GITHUB_REF_NAME '.\dist\texto-youtube-windows-x64.zip' --repo $env:GITHUB_REPOSITORY --clobber
